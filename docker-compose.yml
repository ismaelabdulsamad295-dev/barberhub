services:
  db:
    image: postgis/postgis:16-3.4
    container_name: barberhub-db
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber_dev_password
      POSTGRES_DB: barberhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barberhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: